<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dúvidas - Juliana Miranda</title>
    <link rel="stylesheet" type="text/css" href="../css/style2.css">
</head>
<body class="paginaForm">
        <div>
            <img class="logo" src="../img/Logo.png" alt="Juliana Miranda - voltar ao início">
        </div>
    <main class="geral">
        <h1>Dúvidas</h1>
        <form id="formulario" novalidate>
            <!-- Campo Nome -->
            <label>Nome</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            <span class="erro" id="erroNome" aria-live="polite"></span>
            <!-- Campo Email -->
            <label>E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            <span class="erro" id="erroEmail" aria-live="polite"></span>
            <!-- Campo Dúvida -->
            <label>Dúvida</label>
            <textarea id="duvida" name="duvida" rows="7" maxlength="100"
                      placeholder="Escreva aqui sua dúvida..." required></textarea>
            <span class="erro" id="erroDuvida" aria-live="polite"></span>
            <!-- Avaliação -->
            <label>Avalie nosso site</label>
            <select id="nota" name="nota" required>
                <option value="">Selecione uma nota</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
            </select>
            <span class="erro" id="erroNota" aria-live="polite"></span>
            <p id="mensagemSucesso"></p>
            <div class="botoes">
                <button type="submit">Enviar</button>
                <button type="reset" id="limpar">Limpar</button>
                <a class="voltar" href="inicial.html">Voltar</a>
            </div>
        </form>
    </main>
    <script src="../js/form.js"></script>
</body>
</html>
